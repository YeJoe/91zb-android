name: build-apk

on:
  push:
    branches: [duocai]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'app-data/**'
  pull_request:
    branches: [duocai]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '1.0.0' }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 仓库里不放 gradle-wrapper.jar（二进制），直接用指定版本的 gradle 命令
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Resolve signing config
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "→ 用 secret 里的 keystore 签 release"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "→ 没有 KEYSTORE_BASE64，回落 debug 签名（装得上，商店不能收）"
          fi

      # 构建失败时把 Kotlin/Gradle 的报错打成 annotation，
      # 这样在 Actions 页面不用点开日志就能看到错在哪一行
      - name: Build
        id: build
        run: |
          set +e
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            TARGET=:app:assembleRelease
          else
            TARGET=:app:assembleDebug
          fi
          echo "→ gradle $TARGET"
          gradle "$TARGET" --no-daemon --stacktrace --console=plain 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "===== 失败摘要 ====="
            grep -nE "^(e: |w: .*error|FAILURE|> Task .*FAILED|\* What went wrong|Caused by:)" build.log \
              | head -40 | while IFS= read -r line; do
                echo "::error title=gradle::$line"
              done
            tail -n 60 build.log
            exit $code
          fi

      - name: Collect APKs
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -exec cp {} dist/ \;
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ github.run_number }}
          path: |
            dist/*.apk
            build.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v') && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --title "TM Live $GITHUB_REF_NAME" \
            --notes "自动构建：$GITHUB_SHA" \
          || gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
