name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 用 v4 + 显式 packages：v3 的默认值是 "tools platform-tools"，
      # 而 Google 已从 SDK 仓库下架 legacy "tools" 包，v3 会直接
      # "Failed to find package 'tools'" 并以 exit code 1 结束，整个 job 在编译前就挂掉。
      # v4 的默认值只有 platform-tools；这里再显式写一遍，避免依赖默认值变化。
      # 只接受单个包名，多行/空格分隔的值会被当成一个包名传给 sdkmanager。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # 包名必须加引号（; 是 shell 命令分隔符），且每个包是独立参数
      - name: Install SDK 34 packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # 仓库不提交二进制 gradle-wrapper.jar，这里装确定版本的 Gradle 再生成 wrapper
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7 --no-daemon

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      # 失败时把真正的 Gradle 报错写成注解，便于命令行 / API 读取
      - name: Report Gradle errors
        if: failure()
        run: |
          [ -f build.log ] || { echo "::error title=Gradle::build.log missing"; exit 0; }
          grep -aE "^e: |^w: .*(error|warning)|What went wrong|^> Task .* FAILED|error:|Caused by:|A problem occurred|Execution failed" build.log | head -15 | while IFS= read -r line; do
            echo "::error title=Gradle::${line//$'\r'/}"
          done
          exit 0

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jjlive-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
