<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>player</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
  #box{position:absolute;left:0;top:0;width:100%;height:100%;background:#000}
  #box canvas,#box video{max-width:100%;max-height:100%}
</style>
<script src="./jessibuca.js"></script>
</head>
<body>
<div id="box"></div>
<script>
(function () {
  var box = document.getElementById('box');
  var jess = null;

  function report(type, msg) {
    try {
      if (window.Native && window.Native.onEvent) {
        window.Native.onEvent(String(type), String(msg == null ? '' : msg));
      }
    } catch (e) { /* ignore */ }
  }

  function create() {
    // 纯 WASM 软解 + canvas 渲染：不依赖设备 HEVC 硬解、不依赖 WebCodecs，
    // 这正是网页版能出画面的那条链路。
    jess = new Jessibuca({
      container: box,
      decoder: './decoder.js',
      videoBuffer: 0.15,
      loadingText: '',
      debug: false,
      isNotMute: true,
      hasVideo: true,
      hasAudio: true,
      keepScreenOn: true,
      forceNoOffscreen: false,
      useMSE: false,
      useWCS: false,
      autoWasm: true,
      heartTimeoutReplay: true,
      heartTimeoutReplayTimes: 3,
      text: ''
    });

    jess.on('load', function () { report('load', ''); });
    jess.on('play', function () { report('playing', ''); });
    jess.on('videoInfo', function (i) {
      report('info', (i && i.width ? i.width : 0) + 'x' + (i && i.height ? i.height : 0));
    });
    jess.on('audioInfo', function (a) {
      report('audio', JSON.stringify(a || {}));
    });
    jess.on('timeout', function () { report('timeout', ''); });
    jess.on('error', function (e) { report('error', e); });
    jess.on('stats', function (s) { report('stats', JSON.stringify(s || {})); });
    return jess;
  }

  function destroy() {
    try { if (jess) { jess.destroy(); } } catch (e) { }
    jess = null;
    try { box.innerHTML = ''; } catch (e) { }
  }

  window.startStream = function (url) {
    try {
      destroy();
      create();
      var p = jess.play(url);
      if (p && p.then) {
        p.then(function () { report('ok', ''); })
         .catch(function (err) { report('error', (err && err.message) || err); });
      }
      return 'ok';
    } catch (e) {
      report('error', (e && e.message) || e);
      return 'err:' + ((e && e.message) || e);
    }
  };

  window.stopStream = function () { destroy(); };

  // 某些 WebView 需要一次用户手势才会放行音频，点一下画面即可恢复
  document.addEventListener('click', function () {
    try {
      if (window.AudioContext || window.webkitAudioContext) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC && AC.prototype && !window.__acResumed) { window.__acResumed = true; }
      }
    } catch (e) { }
  }, true);

  report('ready', '');
})();
</script>
</body>
</html>
